name: Build Tuunie APK

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release, arm only)
        run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuunie-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
