# Codemagic CI/CD Configuration for Tuunie
# https://docs.codemagic.io/yaml-quick-start/

workflows:
  android-release:
    name: Android Release APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Run analyzer
        script: |
          flutter analyze --no-fatal-infos || echo "Lint warnings (non-fatal)"
      - name: Build APK (release)
        script: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --no-tree-shake-icons
      - name: Copy APK to artifacts
        script: |
          cp build/app/outputs/flutter-apk/app-release.apk tuunie-release.apk
          ls -lh tuunie-release.apk
    artifacts:
      - tuunie-release.apk
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.pub-cache
    machine_type: E2_MEDIUM
    triggering:
      events:
        - push
        - tag
        - manual

  android-debug:
    name: Android Debug APK (faster)
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK (debug)
        script: |
          flutter build apk --debug
      - name: Copy APK
        script: |
          cp build/app/outputs/flutter-apk/app-debug.apk tuunie-debug.apk
    artifacts:
      - tuunie-debug.apk
    machine_type: E2_MEDIUM
    triggering:
      events:
        - manual
